{% extends "base.html" %}

{% block title %}Inscription — NOVATECH{% endblock %}

{% block content %}
<div class="form-page">
    <div class="section-header">
        <span class="section-label">Nouveau client</span>
        <h2 class="section-title">Créer un compte</h2>
    </div>

    <form method="post">
        <div class="form-group">
            <label class="form-label" for="name">Nom complet</label>
            <input type="text" id="name" name="name" class="form-input" placeholder="Jean Dupont" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="email">Adresse email</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="vous@entreprise.com" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="phone">Téléphone</label>
            <input type="tel" id="phone" name="phone" class="form-input" placeholder="06 12 34 56 78">
        </div>
        <div class="form-group">
            <label class="form-label" for="company">Entreprise (optionnel)</label>
            <input type="text" id="company" name="company" class="form-input" placeholder="Nom de votre entreprise">
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Mot de passe</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="8 caractères minimum" required minlength="8">
        </div>
        <button type="submit" class="btn btn--primary btn--block">Créer mon compte</button>
    </form>

    <p class="form-footer">
        Déjà inscrit ? <a href="{{ url_for('login') }}">Se connecter</a>
    </p>
</div>
{% endblock %}
