{% extends "base.html" %}

{% block title %}Connexion — NOVATECH{% endblock %}

{% block content %}
<div class="form-page">
    <div class="section-header">
        <span class="section-label">Espace client</span>
        <h2 class="section-title">Connexion</h2>
    </div>

    <form method="post">
        <div class="form-group">
            <label class="form-label" for="email">Adresse email</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="vous@entreprise.com" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Mot de passe</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn--primary btn--block">Se connecter</button>
    </form>

    <p class="form-footer">
        Pas encore de compte ? <a href="{{ url_for('register') }}">Créer un compte</a>
    </p>
</div>
{% endblock %}
