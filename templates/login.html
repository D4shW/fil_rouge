{% extends "base.html" %}

{% block title %}Connexion — NOVATECH{% endblock %}

{% block content %}
<div class="form-page">
    <div class="section-header">
        <span class="section-label">Espace client</span>
        <h1 class="section-title">Connexion</h1>
    </div>

    <form method="post" novalidate>
        <div class="form-group">
            <label class="form-label" for="email">Adresse email <span aria-hidden="true">*</span></label>
            <input type="email" id="email" name="email" class="form-input"
                   placeholder="vous@entreprise.com"
                   autocomplete="email"
                   aria-required="true"
                   required>
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Mot de passe <span aria-hidden="true">*</span></label>
            <input type="password" id="password" name="password" class="form-input"
                   placeholder="••••••••"
                   autocomplete="current-password"
                   aria-required="true"
                   required>
        </div>
        <button type="submit" class="btn btn--primary btn--block">Se connecter</button>
    </form>

    <p class="form-footer">
        Pas encore de compte ? <a href="{{ url_for('auth.register') }}">Créer un compte</a>
    </p>
</div>
{% endblock %}
