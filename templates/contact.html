{% extends "base.html" %}

{% block title %}Contact — NOVATECH{% endblock %}

{% block content %}
<div class="form-page form-page--wide">
    <div class="section-header">
        <span class="section-label">Contact</span>
        <h1 class="section-title">Nous contacter</h1>
        <p class="section-desc">Une question, un besoin urgent, une demande de devis ? Écrivez-nous.</p>
    </div>

    <form method="post" novalidate>
        <div class="form-group">
            <label class="form-label" for="name">Nom complet <span aria-hidden="true">*</span></label>
            <input type="text" id="name" name="name" class="form-input"
                   placeholder="Jean Dupont"
                   autocomplete="name"
                   aria-required="true"
                   required>
        </div>
        <div class="form-group">
            <label class="form-label" for="email">Email <span aria-hidden="true">*</span></label>
            <input type="email" id="email" name="email" class="form-input"
                   placeholder="vous@entreprise.com"
                   autocomplete="email"
                   aria-required="true"
                   required>
        </div>
        <div class="form-group">
            <label class="form-label" for="phone">Téléphone</label>
            <input type="tel" id="phone" name="phone" class="form-input"
                   placeholder="06 12 34 56 78"
                   autocomplete="tel">
        </div>
        <div class="form-group">
            <label class="form-label" for="subject">Sujet</label>
            <input type="text" id="subject" name="subject" class="form-input"
                   placeholder="Dépannage, devis, partenariat...">
        </div>
        <div class="form-group">
            <label class="form-label" for="message">Message <span aria-hidden="true">*</span></label>
            <textarea id="message" name="message" class="form-input"
                      placeholder="Décrivez votre besoin en détail..."
                      aria-required="true"
                      required></textarea>
        </div>
        <button type="submit" class="btn btn--primary btn--block">Envoyer le message</button>
    </form>
</div>
{% endblock %}
