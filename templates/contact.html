{% extends "base.html" %}

{% block title %}Contact — NOVATECH{% endblock %}

{% block content %}
<div class="form-page form-page--wide">
    <div class="section-header">
        <span class="section-label">Contact</span>
        <h2 class="section-title">Nous contacter</h2>
        <p class="section-desc">Une question, un besoin urgent, une demande de devis ? Écrivez-nous.</p>
    </div>

    <form method="post">
        <div class="form-group">
            <label class="form-label" for="name">Nom complet</label>
            <input type="text" id="name" name="name" class="form-input" placeholder="Jean Dupont" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="vous@entreprise.com" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="phone">Téléphone</label>
            <input type="tel" id="phone" name="phone" class="form-input" placeholder="06 12 34 56 78">
        </div>
        <div class="form-group">
            <label class="form-label" for="subject">Sujet</label>
            <input type="text" id="subject" name="subject" class="form-input" placeholder="Dépannage, devis, partenariat...">
        </div>
        <div class="form-group">
            <label class="form-label" for="message">Message</label>
            <textarea id="message" name="message" class="form-input" placeholder="Décrivez votre besoin en détail..." required></textarea>
        </div>
        <button type="submit" class="btn btn--primary btn--block">Envoyer le message</button>
    </form>
</div>
{% endblock %}
