{% extends 'base.html' %}
{% block title %}Admin — Connexion{% endblock %}

{% block content %}
<section class="section section--sm">
    <div class="form-card" style="max-width:400px;margin:4rem auto;">
        <h1 class="form-card__title">Accès administration</h1>
        <form method="post" action="{{ url_for('admin.login') }}" novalidate>
            <div class="form-group">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" id="password" name="password"
                       class="form-input" required autofocus>
            </div>
            <button type="submit" class="btn btn--primary btn--full">Se connecter</button>
        </form>
    </div>
</section>
{% endblock %}
